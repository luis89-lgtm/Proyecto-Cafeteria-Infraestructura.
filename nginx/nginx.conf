events {
    worker_connections 1024;
}

http {
    # Configuración de Balanceo de Cargas (Load Balancing)
    upstream frontend_servers {
        server frontend:5173;
        # Si tuviéramos más contenedores de frontend, se agregarían aquí
        # server frontend2:5173; 
    }

    upstream backend_servers {
        server backend:3001;
    }

    # Redirección de HTTP a HTTPS (Seguridad)
    server {
        listen 80;
        server_name www.cafetech-estudio.com cafetech-estudio.com;
        
        # Redirigir todo el tráfico a HTTPS
        # return 301 https://$host$request_uri;
        
        # Para propósitos de pruebas locales sin certificados reales, servimos por el puerto 80:
        location / {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Configuración de Servidor Seguro (Certificados SSL) - Comentado para pruebas locales
    # server {
    #     listen 443 ssl;
    #     server_name www.cafetech-estudio.com;
    #
    #     ssl_certificate /etc/nginx/certs/cafetech.crt;
    #     ssl_certificate_key /etc/nginx/certs/cafetech.key;
    #
    #     location / {
    #         proxy_pass http://frontend_servers;
    #     }
    # }
}
